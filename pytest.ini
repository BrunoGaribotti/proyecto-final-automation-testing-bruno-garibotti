[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*

# --self-contained-html: un único archivo HTML con las capturas embebidas.
addopts = -v --html=reports/reporte.html --self-contained-html

markers =
    ui: pruebas de interfaz con Selenium WebDriver
    api: pruebas de API con Requests
    e2e: flujos completos de punta a punta

# Logging: en consola durante la ejecución y en logs/ejecucion.log para depurar.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = logs/ejecucion.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
